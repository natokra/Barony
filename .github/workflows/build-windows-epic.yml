name: Build Barony 15p (Epic Games x64 FINAL)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- CACHE DE VCPKG (Ahorra tiempo desde el 2do run) ---
      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg x64)
        run: vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Surgical Patching (Technical Integration)
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $vcpkgLib = "$vcpkgRoot/installed/x64-windows/lib"
          $vcpkgInclude = "$vcpkgRoot/installed/x64-windows/include"
          
          # Localización del SDK
          $eosLibFile = Get-ChildItem -Path "deps" -Filter "EOSSDK-Win64-Shipping.lib" -Recurse | Select-Object -First 1
          $eosLibPath = $eosLibFile.FullName.Replace('\', '/')
          $eosInclude = "$pwd/deps/eos/include".Replace('\', '/')
          
          # IDs Reales para inyección en binario
          $eProdID = "38276f7f6f4d4127929424c803027b40"
          $eSandID = "899732f74136450992383842c1630132"
          $eDeplID = "39f3796d19ca447285ec43764835848e"
          $eClieID = "xyza78912q6mHnd5O1TjL2H9YmD83W4v"
          $eosMacros = "-DPRODUCT_ID=\`"$eProdID\`" -DSANDBOX_ID=\`"$eSandID\`" -DDEPLOYMENT_ID=\`"$eDeplID\`" -DCLIENT_ID=\`"$eClieID\`""
          
          $cmakePath = "CMakeLists.txt"
          # Corregido: Get-Content
          $content = Get-Content $cmakePath
          
          # Inyecciones críticas
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`"$vcpkgInclude`")`ninclude_directories(`"$eosInclude`")`nadd_definitions(-DNOMINMAX -D_CRT_SECURE_NO_WARNINGS -DWIN64 -DEGP -DUSE_EOS -D__STDC_FORMAT_MACROS $eosMacros)"
          $content = $content -replace 'target_link_libraries\(barony', "target_link_libraries(barony `"$eosLibPath`" "
          $content | Set-Content $cmakePath

          # Parches de código x64 (SavePNG y Lambdas)
          if (Test-Path "src/savepng.cpp") {
              $pngTxt = [IO.File]::ReadAllText("src/savepng.cpp")
              $pngTxt = $pngTxt -replace 'png_set_rows\(png_ptr, info_ptr, row_pointers\)', 'png_set_rows(png_ptr, info_ptr, (png_bytepp)row_pointers)'
              [IO.File]::WriteAllText("src/savepng.cpp", $pngTxt)
          }
          $filesToFix = @("src/net.cpp", "src/ui/MainMenu.cpp")
          foreach ($f in $filesToFix) {
              if (Test-Path $f) {
                  $txt = [IO.File]::ReadAllText($f)
                  $txt = $txt -replace '\[=\s*\]\s*\(', '[=, this]('
                  [IO.File]::WriteAllText($f, $txt)
              }
          }
          Add-Content -Path "src/main.hpp" -Value "`n#include <inttypes.h>`n#ifdef GetObject`n#undef GetObject`n#endif`n#ifdef ERROR`n#undef ERROR`n#endif"

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_CXX_STANDARD=17 -DSTEAM=OFF -DEGP=ON -DUSE_EOS=ON -DEOS_ENABLED=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN64 /EHsc /D__STDC_FORMAT_MACROS /wd4311 /wd4312 /wd4573 /wd4805"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Collect Suite
        shell: pwsh
        run: |
          $binDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $outDir = "build/Release"
          Copy-Item "$binDir/*.dll" -Destination $outDir -Force
          Get-ChildItem -Path "." -Filter "EOSSDK-Win64-Shipping.dll" -Recurse | Copy-Item -Destination $outDir -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-x64-FINAL
          path: build/Release/
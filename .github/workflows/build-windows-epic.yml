name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Patch Source (Deep Clean)
        shell: pwsh
        run: |
          # 1. Nuke Editor from CMakeLists (Fiabilidad 95%)
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          $content = $content -replace 'add_subdirectory\(editor\)', '# add_subdirectory(editor)'
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)'
          
          # Inyectar headers de vcpkg y forzar GLEW_STATIC
          $vcpkgInclude = "`$ENV{VCPKG_INSTALLATION_ROOT}/installed/x64-windows/include"
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories($vcpkgInclude)`nadd_definitions(-DGLEW_STATIC)"
          $content | Set-Content $cmakePath

          # 2. Fix C2512 StatusEffectQueue_t (Fiabilidad 75% - Disclaimer: Depende de la ruta exacta)
          # Buscamos el archivo en todo el src
          $uiHeader = Get-ChildItem -Path "src" -Filter "GameUI.hpp" -Recurse | Select-Object -ExpandProperty FullName
          if ($uiHeader) {
              (Get-Content $uiHeader) -replace 'struct StatusEffectQueue_t \{', 'struct StatusEffectQueue_t { StatusEffectQueue_t() = default;' | Set-Content $uiHeader
              Write-Host "Patched $uiHeader"
          }

          # 3. Nuke GetObject (Fiabilidad 90%)
          $mainHpp = "src/main.hpp"
          Add-Content -Path $mainHpp -Value "`n#ifdef GetObject`n#undef GetObject`n#endif`n#define NOMINMAX"

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DBUILD_EDITOR=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc /DGLEW_STATIC"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

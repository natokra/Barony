name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg x86)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x86-windows

      - name: Surgical Patching (Source & CMake)
        shell: pwsh
        run: |
          # 1. Sanitizar paths para CMake (cambiar \ por /)
          $vcpkgLib = ($env:VCPKG_INSTALLATION_ROOT + "/installed/x86-windows/lib").Replace('\', '/')
          $vcpkgInclude = ($env:VCPKG_INSTALLATION_ROOT + "/installed/x86-windows/include").Replace('\', '/')
          
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          
          # 2. Neutralizar subproyectos y FMOD
          $content = $content -replace 'add_subdirectory\(editor\)', '# Editor OFF'
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# FMOD OFF'
          $content = $content -replace 'find_package\(FMOD\)', '# FMOD OFF'
          
          # 3. Inyectar configuraciones (con comillas y paths limpios)
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`"$vcpkgInclude`")`nadd_definitions(-DGLEW_STATIC -DNOMINMAX -D_CRT_SECURE_NO_WARNINGS)"
          
          # 4. Linkeo Forzado (Rutas absolutas con forward slashes)
          $libs = "`"$vcpkgLib/glew32s.lib`" `"$vcpkgLib/physfs.lib`" `"$vcpkgLib/SDL2.lib`" `"$vcpkgLib/SDL2_image.lib`" `"$vcpkgLib/SDL2_net.lib`" `"$vcpkgLib/SDL2_ttf.lib`" `"$vcpkgLib/jsoncpp.lib`" Opengl32.lib"
          $content = $content -replace 'target_link_libraries\(barony', "target_link_libraries(barony $libs "
          
          $content | Set-Content $cmakePath

          # 5. Aplicar parches de codigo (StatusEffectQueue y GetObject)
          Get-ChildItem -Path "src" -Filter "*.hpp" -Recurse | ForEach-Object {
              $txt = [IO.File]::ReadAllText($_.FullName)
              if ($txt -match "struct\s+StatusEffectQueue_t") {
                  $txt = $txt -replace "(struct\s+StatusEffectQueue_t\s*\{)", "`$1 StatusEffectQueue_t() = default;"
                  [IO.File]::WriteAllText($_.FullName, $txt)
              }
          }
          Add-Content -Path "src/main.hpp" -Value "`n#ifdef GetObject`n#undef GetObject`n#endif"

      - name: Configure CMake (Win32)
        run: |
          cmake -B build -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DCMAKE_CXX_STANDARD=17 `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc /DGLEW_STATIC"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: llvm/actions/install-ninja@master

      - name: Install dependencies (vcpkg x86)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x86-windows

      - name: Surgical Patching (Linker & Paths)
        shell: pwsh
        run: |
          # 1. Localizar dinámicamente la librería de GLEW (Fiabilidad: 95%)
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $libDir = "$vcpkgRoot/installed/x86-windows/lib"
          $includeDir = "$vcpkgRoot/installed/x86-windows/include"
          
          # Buscamos si es glew32s.lib o glew32.lib
          $glewLib = Get-ChildItem -Path "$libDir/glew32*.lib" | Select-Object -First 1 -ExpandProperty Name
          Write-Host "Found GLEW lib: $glewLib"

          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          
          # 2. Limpieza de CMake
          $content = $content -replace 'add_subdirectory\(editor\)', '# Editor OFF'
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# FMOD OFF'
          $content = $content -replace 'find_package\(FMOD\)', '# FMOD OFF'
          
          # 3. Inyectar Definiciones y Paths (Fiabilidad: 100%)
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`"$includeDir`")`nadd_definitions(-DGLEW_STATIC -DNOMINMAX -D_CRT_SECURE_NO_WARNINGS)"
          
          # 4. Linkeo Forzado con paths sanitizados
          $libs = "`"$libDir/$glewLib`" `"$libDir/physfs.lib`" `"$libDir/SDL2.lib`" `"$libDir/SDL2_image.lib`" `"$libDir/SDL2_net.lib`" `"$libDir/SDL2_ttf.lib`" `"$libDir/jsoncpp.lib`" Opengl32.lib"
          $content = $content -replace 'target_link_libraries\(barony', "target_link_libraries(barony $libs "
          
          $content | Set-Content $cmakePath

          # 5. Parches de código (Ya validados en el run anterior)
          Get-ChildItem -Path "src" -Filter "*.hpp" -Recurse | ForEach-Object {
              $txt = [IO.File]::ReadAllText($_.FullName)
              if ($txt -match "struct\s+StatusEffectQueue_t") {
                  $txt = $txt -replace "(struct\s+StatusEffectQueue_t\s*\{)", "`$1 StatusEffectQueue_t() = default;"
                  [IO.File]::WriteAllText($_.FullName, $txt)
              }
          }
          Add-Content -Path "src/main.hpp" -Value "`n#ifdef GetObject`n#undef GetObject`n#endif"

      - name: Configure CMake (Win32)
        run: |
          cmake -B build -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DCMAKE_CXX_STANDARD=17 `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc /DGLEW_STATIC"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

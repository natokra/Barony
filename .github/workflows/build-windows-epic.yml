name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Heavy Patching (Source & CMake)
        shell: pwsh
        run: |
          # 1. Neutralizar FMOD y forzar GLEW_STATIC en CMakeLists
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)'
          $content = $content -replace 'add_subdirectory\(editor\)', '# Editor disabled'
          $vcpkgInclude = "`$ENV{VCPKG_INSTALLATION_ROOT}/installed/x64-windows/include"
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories($vcpkgInclude)`nadd_definitions(-DGLEW_STATIC -DNOMINMAX)"
          $content | Set-Content $cmakePath

          # 2. Fix C2512 StatusEffectQueue_t (Búsqueda agresiva)
          # Buscamos en todo el directorio src el archivo que define la estructura
          Get-ChildItem -Path "src" -Filter "*.hpp" -Recurse | ForEach-Object {
              $fileContent = Get-Content $_.FullName
              if ($fileContent -match "struct StatusEffectQueue_t") {
                  Write-Host "Patching StatusEffectQueue_t in $($_.FullName)"
                  $fileContent -replace 'struct StatusEffectQueue_t \{', 'struct StatusEffectQueue_t { StatusEffectQueue_t() {}' | Set-Content $_.FullName
              }
          }

          # 3. Nuke GetObject en main.hpp
          $mainHpp = "src/main.hpp"
          Add-Content -Path $mainHpp -Value "`n#ifdef GetObject`n#undef GetObject`n#endif"

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DBUILD_EDITOR=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc /DGLEW_STATIC"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

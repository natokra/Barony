name: Build Barony 15p (EPIC)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # IMPORTANTE: debe ir ANTES de instalar vcpkg para que el cache funcione
      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg x64)
        run: vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Apply source patches
        shell: pwsh
        run: |
          $files = @("src/net.cpp", "src/ui/MainMenu.cpp", "src/savepng.cpp")
          foreach ($f in $files) {
              if (Test-Path $f) {
                  $t = [IO.File]::ReadAllText($f)
                  $t = $t -replace 'png_set_rows\(png_ptr, info_ptr, row_pointers\)', 'png_set_rows(png_ptr, info_ptr, (png_bytepp)row_pointers)'
                  $t = $t -replace '\[=\s*\]\s*\(', '[=, this]('
                  [IO.File]::WriteAllText($f, $t)
              }
          }

      - name: Configure CMake
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_ENV_PR="${{ secrets.BUILD_ENV_PR }}" `
            -DBUILD_ENV_SA="${{ secrets.BUILD_ENV_SA }}" `
            -DBUILD_ENV_DE="${{ secrets.BUILD_ENV_DE }}" `
            -DBUILD_ENV_CC="${{ secrets.BUILD_ENV_CC }}" `
            -DBUILD_ENV_CS="${{ secrets.BUILD_ENV_CS }}"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Collect DLLs
        shell: pwsh
        run: |
          $binDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $outDir = "build/Release"
          if (Test-Path $outDir) {
            Copy-Item "$binDir/*.dll" -Destination $outDir -Force
            Get-ChildItem -Path "." -Filter "EOSSDK-Win64-Shipping.dll" -Recurse |
              Copy-Item -Destination $outDir -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-x64-epic
          path: build/Release/
name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies (vcpkg x86)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x86-windows

      - name: Surgical Patching (Linker & Clean CMake)
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $vcpkgInclude = "$vcpkgRoot/installed/x86-windows/include"
          
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          
          $content = $content -replace 'add_subdirectory\(editor\)', '# Editor OFF'
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# FMOD OFF'
          $content = $content -replace 'find_package\(FMOD\)', '# FMOD OFF'
          
          $content = $content -replace 'project\(barony\)', "project(barony)`nfind_package(GLEW REQUIRED)`ninclude_directories(`"$vcpkgInclude`")`nadd_definitions(-DNOMINMAX -D_CRT_SECURE_NO_WARNINGS -DWIN32)"
          
          # Enlace Dinámico
          $content = $content -replace 'target_link_libraries\(barony', "target_link_libraries(barony GLEW::GLEW "
          
          $content | Set-Content $cmakePath

          Get-ChildItem -Path "src" -Filter "*.hpp" -Recurse | ForEach-Object {
              $txt = [IO.File]::ReadAllText($_.FullName)
              if ($txt -match "struct\s+StatusEffectQueue_t") {
                  $txt = $txt -replace "(struct\s+StatusEffectQueue_t\s*\{)", "`$1 StatusEffectQueue_t() = default;"
                  [IO.File]::WriteAllText($_.FullName, $txt)
              }
          }
          Add-Content -Path "src/main.hpp" -Value "`n#ifdef GetObject`n#undef GetObject`n#endif"

      - name: Configure CMake (Win32 Dynamic)
        run: |
          cmake -B build -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DCMAKE_CXX_STANDARD=17 `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Collect Dependencies (DLLs)
        shell: pwsh
        run: |
          $binDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows/bin"
          $outDir = "build/Release"
          Write-Host "Collecting DLLs from $binDir to $outDir"
          Copy-Item "$binDir/*.dll" -Destination $outDir -Force
          # Verificamos que glew32.dll esté ahí
          if (Test-Path "$outDir/glew32.dll") { Write-Host "glew32.dll successfully collected." }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-suite
          path: build/Release/

name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Patch CMakeLists (Nuke FMOD)
        shell: pwsh
        run: |
          # Esto es un 'sed' de PowerShell para comentar la línea que traba todo
          $path = "CMakeLists.txt"
          (Get-Content $path) -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)' `
                              -replace 'find_package\(FMOD\)', '# find_package(FMOD)' | `
          Set-Content $path
          Write-Host "FMOD requirements have been neutralized."

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DFMOD=OFF `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DUSE_OPENAL=ON `
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Barony 15p Executable
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

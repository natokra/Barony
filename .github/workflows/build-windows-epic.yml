name: Build Barony 15p (Epic Games + EOS Fix)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x86-windows

      - name: Surgical Patching (EOS & Linker)
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $libDir = "$vcpkgRoot/installed/x86-windows/lib"
          $includeDir = "$vcpkgRoot/installed/x86-windows/include"
          
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          
          # 1. Forzar la detección de EOS y EGP
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`"$includeDir`")`nadd_definitions(-DNOMINMAX -D_CRT_SECURE_NO_WARNINGS -DWIN32 -DEGP -DUSE_EOS)"
          
          # 2. Intentar encontrar el path del SDK de Epic en el repo
          # Barony suele tenerlo en una carpeta 'eos' o similar.
          $eosInclude = Get-ChildItem -Path "." -Filter "eos_sdk.h" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($eosInclude) {
              $eosInclude = $eosInclude.Replace('\', '/')
              Write-Host "Found EOS Headers at $eosInclude"
              $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`"$eosInclude`")"
          }

          # 3. Linkeo Forzado (Añadimos GLEW y las libs base)
          $libs = "glew32.lib physfs.lib SDL2.lib SDL2_image.lib SDL2_net.lib SDL2_ttf.lib jsoncpp.lib Opengl32.lib Glu32.lib"
          $content = $content -replace 'target_link_libraries\(barony', "target_link_libraries(barony $libs "
          
          $content | Set-Content $cmakePath

          # 4. Parches de código previos
          Get-ChildItem -Path "src" -Filter "*.hpp" -Recurse | ForEach-Object {
              $txt = [IO.File]::ReadAllText($_.FullName)
              if ($txt -match "struct\s+StatusEffectQueue_t") {
                  $txt = $txt -replace "(struct\s+StatusEffectQueue_t\s*\{)", "`$1 StatusEffectQueue_t() = default;"
                  [IO.File]::WriteAllText($_.FullName, $txt)
              }
          }
          Add-Content -Path "src/main.hpp" -Value "`n#ifdef GetObject`n#undef GetObject`n#endif"

      - name: Configure CMake
        run: |
          cmake -B build -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DCMAKE_CXX_STANDARD=17 `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_EOS=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32 /EHsc"

      - name: Build Project
        run: cmake --build build --config Release --target barony

      - name: Collect Dependencies
        shell: pwsh
        run: |
          $binDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows/bin"
          $outDir = "build/Release"
          Copy-Item "$binDir/*.dll" -Destination $outDir -Force
          # Buscamos la DLL de Epic si existe en el build
          Get-ChildItem -Path "." -Filter "EOSSDK-Win32-Shipping.dll" -Recurse | Copy-Item -Destination $outDir -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-eos-fix
          path: build/Release/

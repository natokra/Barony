name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup vcpkg con cacheo automático (esto resolverá los 10 minutos de espera)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '347209930f35905d4a98444a838f32230ee0f4c0'
          runVcpkgInstall: true
          vcpkgArguments: '${{ env.VCPKG_PACKAGES }}'
          vcpkgTriplet: x64-windows

      - name: Patch CMakeLists (Nuke FMOD & Fix Headers)
        shell: pwsh
        run: |
          $path = "CMakeLists.txt"
          $content = Get-Content $path
          # Desactivamos FMOD
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)'
          $content = $content -replace 'find_package\(FMOD\)', '# find_package(FMOD)'
          
          # Inyectamos el path de headers de vcpkg
          $vcpkgInclude = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include"
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories($vcpkgInclude)"
          
          $content | Set-Content $path

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS" # Fix para macros y warnings unsafe

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Patch Source & CMake
        shell: pwsh
        run: |
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath
          
          # 1. Neutralizamos FMOD e inyectamos headers
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)'
          $vcpkgInclude = "`$ENV{VCPKG_INSTALLATION_ROOT}/installed/x64-windows/include"
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories($vcpkgInclude)"
          $content | Set-Content $cmakePath

          # 2. FIX C2512: Parcheamos la estructura StatusEffectQueue_t
          # Buscamos dónde está definida (probablemente en GameUI.hpp o similar)
          $uiHeader = "src/ui/GameUI.hpp"
          if (Test-Path $uiHeader) {
              (Get-Content $uiHeader) -replace 'struct StatusEffectQueue_t \{', 'struct StatusEffectQueue_t { StatusEffectQueue_t() = default;' | Set-Content $uiHeader
              Write-Host "Patch applied to StatusEffectQueue_t in GameUI.hpp"
          }

          # 3. FIX GetObject: Al final del header principal
          $mainHpp = "src/main.hpp"
          $undefBlock = @"
          #ifdef GetObject
          #undef GetObject
          #endif
          #ifndef NOMINMAX
          #define NOMINMAX
          #endif
          "@
          Add-Content -Path $mainHpp -Value $undefBlock
          Write-Host "GetObject neutralized."

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DBUILD_EDITOR=OFF `
          -DEDITOR=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /EHsc /DGLEW_STATIC"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Barony 15p Executable
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

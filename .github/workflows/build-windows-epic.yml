name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Añadimos 'dirent' para la compatibilidad de archivos en Windows
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Patch CMakeLists (Nuke FMOD & Fix Dirent)
        shell: pwsh
        run: |
          $path = "CMakeLists.txt"
          $content = Get-Content $path
          # Comentamos FMOD
          $content = $content -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)'
          $content = $content -replace 'find_package\(FMOD\)', '# find_package(FMOD)'
          
          # Forzamos que encuentre el include de dirent de vcpkg si no lo hace solo
          $content = $content -replace 'project\(barony\)', "project(barony)`ninclude_directories(`$ENV{VCPKG_INSTALLATION_ROOT}/installed/x64-windows/include)"
          
          $content | Set-Content $path
          Write-Host "Patches applied: FMOD neutralized and Dirent path added."

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DFMOD=OFF `
          -DOPENAL=ON `
          -DUSE_FMOD=OFF `
          -DUSE_OPENAL=ON `
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Barony 15p Executable
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe

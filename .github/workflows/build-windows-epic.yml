name: Build Barony 15p (Epic Games)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_PACKAGES: 'sdl2 sdl2-image sdl2-net sdl2-ttf openal-soft libogg libvorbis zlib libpng physfs jsoncpp rapidjson dirent glew'
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install ${{ env.VCPKG_PACKAGES }} --triplet x64-windows

      - name: Patch Source & CMake (Fix GetObject & FMOD)
        shell: pwsh
        run: |
          # 1. Neutralizamos FMOD en CMake
          $cmakePath = "CMakeLists.txt"
          (Get-Content $cmakePath) -replace 'find_package\(FMOD REQUIRED\)', '# find_package(FMOD REQUIRED)' `
                                   -replace 'find_package\(FMOD\)', '# find_package(FMOD)' | Set-Content $cmakePath
          
          # 2. Inyectamos headers de vcpkg
          $vcpkgInclude = "`$ENV{VCPKG_INSTALLATION_ROOT}/installed/x64-windows/include"
          (Get-Content $cmakePath) -replace 'project\(barony\)', "project(barony)`ninclude_directories($vcpkgInclude)" | Set-Content $cmakePath

          # 3. FIX CRÍTICO: Matamos la macro GetObject de Windows en el header principal
          $mainHpp = "src/main.hpp"
          $undefBlock = @"
          #ifdef GetObject
          #undef GetObject
          #endif
          #define WIN32_LEAN_AND_MEAN
          "@
          $content = Get-Content $mainHpp
          ($undefBlock + "`n" + ($content -join "`n")) | Set-Content $mainHpp
          Write-Host "Source patched: GetObject macro neutralized in main.hpp"

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DSTEAM=OFF `
          -DEGP=ON `
          -DUSE_FMOD=OFF `
          -DOPENAL=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /D_CRT_SECURE_NO_WARNINGS /EHsc"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Barony 15p Executable
        uses: actions/upload-artifact@v4
        with:
          name: barony-15p-epic-exe
          path: build/Release/barony.exe
